[build-system]
requires = ["setuptools>=45", "wheel", "typing_extensions"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# The Python the code must stay valid for: the oldest one supported.
target-version = "py39"
# The GitHub editor is 127 characters wide.
line-length = 127
extend-exclude = [
    "*.ipynb",
    # The C++ backend, a git submodule: another repository's files.
    "Galaxia-ananke",
    # Generated by versioneer: leave as generated.
    "versioneer.py",
    "src/galaxia_ananke/_version.py",
]

[tool.ruff.lint]
# What fails CI: syntax errors and undefined names (the selection flake8 had).
# CI also prints a broader report, for information only (see ci.yml).
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
files = ["src/galaxia_ananke"]
# The modules are named from src/, as the package is imported (`galaxia_ananke.Input`), and not from where the repository is.
mypy_path = "src"
explicit_package_bases = true
# Generated by versioneer.
exclude = ["_version\\.py$"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# mypy finds no type hints for these libraries: no `py.typed` marker, and no stubs. The types job installs none of them, and
# this covers a library that is not installed as well as one that is installed without hints.
module = [
    "astropy", "astropy.*",
    "astroquery", "astroquery.*",
    "ebf",
    "h5py", "h5py.*",
    "pathos", "pathos.*",
    "vaex", "vaex.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
# -ra says why tests were skipped or are expected to fail; a marker or a setting that pytest does not know is an error
addopts = "-ra --strict-markers --strict-config"
# an expected failure that passes fails the run: the xfail marker of a known bug (see CONTRIBUTING.md) goes with its fix
xfail_strict = true
markers = [
    "integration: runs the compiled backend (installing the package builds it), and is skipped where it is not built",
    "network: uses the network (the SVO filter service), and only runs where GALAXIA_TEST_NETWORK is set",
]
filterwarnings = [
    # Importing the package warns on purpose, about the patch it makes to vaex: a test of its own checks that it does
    "ignore:Importing galaxia_ananke monkey-patches vaex:RuntimeWarning",
    # Python 3.12 and later warn when a process that has threads forks, as the process pools of Output do (the process has
    # the threads of vaex). It is raised in multiprocess, where a user does not see it by default; the filter is for that
    # module alone, so that another fork that warns still shows
    "ignore:This process \\(pid=[0-9]+\\) is multi-threaded, use of fork\\(\\) may lead to deadlocks in the child:DeprecationWarning:multiprocess\\.popen_fork",
]

[tool.coverage.run]
branch = true
source = ["src/galaxia_ananke"]
omit = [
    # Generated by versioneer.
    "*/_version.py",
]

[tool.coverage.report]
# The footer of the modules of the package, `if __name__ == '__main__': raise NotImplementedError()`, is never
# run by a test: it is not counted against the coverage.
exclude_also = [
    "if __name__ == .__main__.:",
]
# The floor of the coverage, by lines and branches, on the Python 3.12 run of CI, which fails under it. When the
# coverage rises, raise it; a change that lowers it needs a test, not a lower floor.
fail_under = 98
