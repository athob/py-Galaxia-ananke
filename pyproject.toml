[build-system]
requires = ["setuptools>=45", "wheel", "typing_extensions"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# The Python the code must stay valid for: the oldest one supported.
target-version = "py39"
# The GitHub editor is 127 characters wide.
line-length = 127
extend-exclude = [
    "*.ipynb",
    # The C++ backend, a git submodule: another repository's files.
    "Galaxia-ananke",
    # Generated by versioneer: leave as generated.
    "versioneer.py",
    "src/galaxia_ananke/_version.py",
]

[tool.ruff.lint]
# What fails CI: syntax errors and undefined names (the selection flake8 had).
# CI also prints a broader report, for information only (see ci.yml).
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.mccabe]
max-complexity = 10
