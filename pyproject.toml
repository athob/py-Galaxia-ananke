[build-system]
requires = ["setuptools>=45", "wheel", "typing_extensions"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# The Python the code must stay valid for: the oldest one supported.
target-version = "py39"
# The GitHub editor is 127 characters wide.
line-length = 127
extend-exclude = [
    "*.ipynb",
    # The C++ backend, a git submodule: another repository's files.
    "Galaxia-ananke",
    # Generated by versioneer: leave as generated.
    "versioneer.py",
    "src/galaxia_ananke/_version.py",
]

[tool.ruff.lint]
# What fails CI: syntax errors and undefined names (the selection flake8 had).
# CI also prints a broader report, for information only (see ci.yml).
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["src/tests"]
# -ra says why tests were skipped or are expected to fail; a marker or a setting that pytest does not know is an error
addopts = "-ra --strict-markers --strict-config"
# an expected failure that passes fails the run: the xfail marker of a known bug (see CONTRIBUTING.md) goes with its fix
xfail_strict = true
markers = [
    "integration: runs the compiled backend (installing the package builds it), and is skipped where it is not built",
    "network: uses the network (the SVO filter service), and only runs where GALAXIA_TEST_NETWORK is set",
]
filterwarnings = [
    # Importing the package warns on purpose, about the patch it makes to vaex: a test of its own checks that it does
    "ignore:Importing galaxia_ananke monkey-patches vaex:RuntimeWarning",
]

[tool.coverage.run]
branch = true
source = ["src/galaxia_ananke"]
omit = [
    # Generated by versioneer.
    "*/_version.py",
]

[tool.coverage.report]
# The footer of the modules of the package, `if __name__ == '__main__': raise NotImplementedError()`, is never
# run by a test: it is not counted against the coverage.
exclude_also = [
    "if __name__ == .__main__.:",
]
# There is no floor yet (fail_under): the suite is being written, and the floor will be the coverage that is measured
# when it is worth keeping. From then on, when the coverage rises, raise the floor; a change that lowers it needs a
# test, not a lower floor.
