# Every `uses:` is pinned to a commit SHA, with the version in a comment: a tag can be
# moved after the fact, a commit cannot. Dependabot proposes the updates.

name: CD

on:
  push:
    tags:
      - 'v*'               # Trigger only when a tag starting with 'v' is pushed

permissions:
  contents: read

env:
  PACKAGE_NAME: galaxia-ananke

jobs:
  meta:
    name: Classify the tag
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.meta.outputs.kind }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Classify the tag and check the changelog
      id: meta
      env:
        TAG: ${{ github.ref_name }}
      # What a tag may look like, and where each kind goes, is in the script. For a
      # release it also makes sure CHANGELOG.md has the section of that version,
      # before anything is built or published.
      run: python3 .github/scripts/release_meta.py check "$TAG" --github-output "$GITHUB_OUTPUT"

  build:
    name: Build distribution 📦
    needs: meta
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read    # to look up the CI run of the tagged commit

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Wait for CI workflow to succeed
      if: needs.meta.outputs.kind == 'prerelease'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        WORKFLOW_FILE="ci.yml"
        # The CI of this package is long (it fetches and builds the C++ backend on
        # four Pythons), and the tag may be pushed right after the commit.
        TIMEOUT=3600
        INTERVAL=10

        # Get the commit SHA (the tag points to)
        COMMIT_SHA=${{ github.sha }}

        echo "Waiting for workflow '$WORKFLOW_FILE' to succeed on commit $COMMIT_SHA..."

        START_TIME=$(date +%s)
        while true; do
          # The latest run of that workflow on that commit (newest first): its conclusion
          # once it has finished, its status (queued, in_progress) until then
          STATUS=$(gh api "repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/runs?head_sha=$COMMIT_SHA&per_page=1" \
            --jq '.workflow_runs[0] | if . == null then "not found" else (.conclusion // .status) end')

          if [ "$STATUS" = "success" ]; then
            echo "Workflow succeeded!"
            break
          elif [ "$STATUS" = "failure" ] || [ "$STATUS" = "neutral" ] || [ "$STATUS" = "cancelled" ] || [ "$STATUS" = "timed_out" ]; then
            echo "Workflow failed with status: $STATUS"
            exit 1
          fi
          
          CURRENT_TIME=$(date +%s)
          ELAPSED=$((CURRENT_TIME - START_TIME))
          if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
            echo "Timeout waiting for workflow to complete."
            exit 1
          fi
          
          echo "Still waiting (current status: $STATUS)... retry in ${INTERVAL}s"
          sleep "$INTERVAL"
        done
    - name: Build distributions inside manylinux2014 container
      run: |
        # Create a directory on the host to store the built artifacts
        mkdir -p dist

        # Run the manylinux container, mounting the repository and the dist directory
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          quay.io/pypa/manylinux2014_x86_64 \
          bash -c "
            # Install git (required by versioneer)
            yum install -y git
            # Trust the workspace directory (avoid dubious ownership error)
            git config --global --add safe.directory /workspace
            # Set up Python (use 3.10 from the manylinux image, choose a version you support)
            export PATH=/opt/python/cp310-cp310/bin:\$PATH
            python -m pip install --upgrade pip build auditwheel
            # Build the distribution (sdist only - no wheel)
            python -m build --sdist
          "
    - name: Store the distribution packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-package-distributions
        path: dist/

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: release
      url: https://test.pypi.org/p/${{ env.PACKAGE_NAME }}

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    if: github.ref_type == 'tag' && needs.meta.outputs.kind == 'release'
    needs:
    - meta
    - build
    runs-on: ubuntu-latest

    environment:
      name: release
      url: https://pypi.org/p/${{ env.PACKAGE_NAME }}

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3