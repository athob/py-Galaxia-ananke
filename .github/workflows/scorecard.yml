name: Scorecard

# OpenSSF Scorecard (https://securityscorecards.dev) grades the repository's supply-chain
# habits: pinned actions, token permissions, a security policy, dependency updates,
# branch protection, signed releases... The results appear under Security > Code
# scanning, and feed a badge. It is a mirror held up to the project: a low score on one
# check is a to-do, not a failure, so nothing here blocks anything and `stable` does
# not wait for it.
#
# Scorecard only ever grades the default branch, so this runs from `main`: weekly, when
# a branch protection rule changes, and when `main` is pushed to. Publishing the results
# is restricted by Scorecard to a workflow of exactly this shape: read-all at the top, a
# few specific steps, and nothing else.

on:
  branch_protection_rule:
  schedule:
    # Thursdays 06:13 UTC.
    - cron: "13 6 * * 4"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write   # to upload the SARIF results to code scanning
      id-token: write          # to publish the results (and the badge) to the OpenSSF
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
      with:
        results_file: results.sarif
        results_format: sarif
        publish_results: true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: scorecard-results
        path: results.sarif
        retention-days: 5
    - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: results.sarif
        category: scorecard
