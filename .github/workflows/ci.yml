# Every `uses:` is pinned to a commit SHA, with the version in a comment: a tag can be
# moved after the fact, a commit cannot. Dependabot proposes the updates.

name: CI

on:
  push:
    branches-ignore:
      - main
      - stable
  pull_request:
    branches:
      - develop
  schedule:
    # Mondays. Nothing here changes in between, but numpy, pandas, vaex and astropy
    # do, and so can GitHub, where the Galaxia-ananke source comes from: this finds out.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push cancels the run of an older one, except on develop, where
  # every commit still has to get through (and be promoted to stable).
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  lint:
    # A pull request from a branch of this repository is already covered by the
    # push to that branch: only those from forks need to run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Lint with ruff
      run: |
        pip install --require-hashes -r .github/requirements/requirements-lint.txt
        # stop the build if there are Python syntax errors or undefined names
        ruff check . --output-format=github
        # exit-zero treats all errors as warnings
        ruff check . --exit-zero --select E,F,W,C90 --statistics

  workflows:
    name: Lint the workflow files
    # A pull request from a branch of this repository is already covered by the
    # push to that branch: only those from forks need to run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      # actionlint (https://github.com/rhysd/actionlint) reads .github/workflows/
      # without running anything: a misspelled key, a `needs:` naming no job, a
      # `${{ }}` expression that cannot work, a `run:` script that shellcheck
      # (preinstalled on the runner) objects to. When the version changes, run
      # .github/requirements/update.sh again: it writes the checksum checked below.
      ACTIONLINT_VERSION: "1.7.12"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install actionlint
      # the release archive of the pinned version, which has to match the checksum
      # committed in .github/requirements/actionlint.sha256
      run: |
        archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
        echo "$(cat .github/requirements/actionlint.sha256)  ${archive}" | sha256sum --check
        tar -xzf "$archive" actionlint
    - name: actionlint
      run: ./actionlint -color

  install:
    # A pull request from a branch of this repository is already covered by the
    # push to that branch: only those from forks need to run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          # The Pythons past their end of life test with their own lock of the test tools,
          # which holds a version of each for every Python (see the .in next to it): the
          # others use requirements/requirements-test.txt, which holds one.
          - python-version: "3.9"
            test-lock: requirements-frozen/requirements-test.txt
            os: ubuntu-22.04
          - python-version: "3.10"
            test-lock: requirements-frozen/requirements-test.txt

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # The C++ backend, Galaxia-ananke, is a git submodule: about 5.8 GB of
        # files, which weigh about 1 GB in git's store. Here it is fetched shallow
        # (just the commit this repository pins), where the installer's own
        # `git submodule update` would fetch the whole history: the installer
        # then finds the source in place. (Measured on the first run: the runners
        # have 146 GB of disk, with about 70 GB still free after the install.)
        submodules: recursive
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      id: pythonsetup
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package
      run: |
        pip install .
    - name: Test with pytest
      if: matrix.python-version != '3.12'
      run: |
        pip install --require-hashes -r .github/${{ matrix.test-lock || 'requirements/requirements-test.txt' }}
        pytest src
    - name: Test with pytest and report the coverage
      if: matrix.python-version == '3.12'
      run: |
        pip install --require-hashes -r .github/${{ matrix.test-lock || 'requirements/requirements-test.txt' }}
        # the floor of the coverage (fail_under, in pyproject.toml), once there is one, is enforced by the
        # report below and not here, so that the table is in the summary of the run when the floor is not reached
        pytest src --cov --cov-fail-under=0
        echo "### Test coverage (Python 3.12)" >> "$GITHUB_STEP_SUMMARY"
        python -m coverage report --format=markdown --skip-empty >> "$GITHUB_STEP_SUMMARY"
  
  package:
    name: Build and check the sdist
    # A pull request from a branch of this repository is already covered by the
    # push to that branch: only those from forks need to run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # versioneer reads the git tags to name the version
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Build the sdist
      # as a release does (see cd.yml): only the sdist is published
      run: |
        pip install --require-hashes -r .github/requirements/requirements-package.txt
        python -m build --sdist
    - name: Check it
      run: |
        # the README is the long description on PyPI: this is what renders it
        twine check --strict dist/*
        # what installing needs is in the sdist, the backend is not, and the revision id
        # the installer looks up is a commit
        python .github/scripts/check_dist.py dist

  promote:
    name: Promote develop to stable
    # Only for a push to develop, and only once lint and the tests have passed.
    # This is a fast-forward by construction: git refuses to push SHA to stable
    # unless stable is an ancestor of SHA, so stable is always exactly a commit
    # that passed CI, and no merge commit (or git identity) is ever needed.
    needs: [lint, workflows, install, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: promote-stable
      cancel-in-progress: false

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        # persist-credentials is left at its default: the push below needs the token
    - name: Fast-forward stable to the commit that just passed
      run: |
        git fetch origin stable
        if git merge-base --is-ancestor "$GITHUB_SHA" origin/stable; then
          echo "stable already contains $GITHUB_SHA (a newer run got there first)."
          exit 0
        fi
        if ! git merge-base --is-ancestor origin/stable "$GITHUB_SHA"; then
          echo "::error::stable has commits that are not on develop, so it cannot be fast-forwarded. Merge stable into develop first."
          exit 1
        fi
        git push origin "$GITHUB_SHA:refs/heads/stable"
        echo "stable is now at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
