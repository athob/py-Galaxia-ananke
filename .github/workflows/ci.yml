# Every `uses:` is pinned to a commit SHA, with the version in a comment: a tag can be
# moved after the fact, a commit cannot. Dependabot proposes the updates.

name: CI

on:
  push:
    branches-ignore:
      - main
      - stable

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push cancels the run of an older one, except on develop, where
  # every commit still has to get through (and be promoted to stable).
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Lint with ruff
      run: |
        pip install ruff
        # stop the build if there are Python syntax errors or undefined names
        ruff check . --output-format=github
        # exit-zero treats all errors as warnings
        ruff check . --exit-zero --select E,F,W,C90 --statistics

  install:

    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          - python-version: "3.9"
            os: ubuntu-22.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      id: pythonsetup
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package
      run: |
        pip install .
    - name: Test with pytest
      run: |
        pip install pytest
        pytest src
  
  develop-post-install:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    needs: [lint, install]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Fetch all unshallow
      run: git fetch --all --unshallow
    - name: Checkout stable
      run: git checkout stable
    - name: Merge develop into stable
      run: git merge develop
    - name: Push merge to repository
      run: git push

    if: github.ref == 'refs/heads/develop'
